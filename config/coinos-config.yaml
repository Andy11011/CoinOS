device:
  layer: rpi3  # rpi4, rpi3

layer:
  custom: coinos

image:
  layer: image-rpios
  boot_part_size: 200%
  root_part_size: 400%
  name: coinos-image
  compression: zstd  # none, gzip, xz, zstd

# config/coinos-config.yaml
image_name: "coinos-image"
image_type: "raspberrypi"
output: "coinos.img"

# Add custom config.txt entries
config_txt:
  - enable_uart=1
  - init_uart_clock=48000000
  - core_freq=250
  - hdmi_force_hotplug=1
  - hdmi_group=2
  - hdmi_mode=82
  - dtparam=audio=on
  - dtoverlay=pi3-disable-bt

# Add custom cmdline.txt entries
cmdline:
  - "console=serial0,115200"
  - "console=tty1"
  - "root=PARTUUID=12345678-02"
  - "rootfstype=ext4"
  - "fsck.repair=yes"
  - "rootwait"
  - "quiet"
  - "splash"